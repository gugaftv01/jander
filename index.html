<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Jander Venâncio · Corretor de Imóveis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jander Venâncio — Corretor de Imóveis. Acompanhe meus imóveis e fale comigo.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --laranja:#ef8a3c; --creme:#f2ecdd; --ink:#0c0c0c; }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:#060606;color:#fff;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;padding:26px 16px calc(34px + env(safe-area-inset-bottom))}
  .wrap{width:min(452px,100%);display:flex;flex-direction:column;align-items:center}
  /* ---- logo topo ---- */
  .topo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
  .topo .mark{width:62px;height:auto;filter:drop-shadow(0 6px 16px rgba(239,138,60,.35))}
  .topo .nome{font-family:'Poppins',sans-serif;font-weight:800;font-size:21px;letter-spacing:.5px;color:#fff;text-align:center;line-height:1}
  .topo .sub{font-family:'Poppins',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.3em;color:var(--laranja);text-transform:uppercase;margin-top:7px}
  /* ---- banners ---- */
  .links{width:100%;display:flex;flex-direction:column;gap:16px}
  .banner{position:relative;display:block;border-radius:22px;overflow:hidden;min-height:196px;
    background:var(--card,#151515);text-decoration:none;color:#fff;
    box-shadow:0 14px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);
    transition:transform .18s ease, box-shadow .18s ease}
  .banner:hover,.banner:focus-visible{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.6);outline:none}
  .banner .bg{position:absolute;top:0;right:0;bottom:0;height:100%;width:64%;z-index:1;object-fit:cover;object-position:52% 16%}
  .banner .glow{position:absolute;top:50%;right:4%;width:180px;height:180px;transform:translateY(-50%);
    border-radius:50%;background:radial-gradient(closest-side,var(--ac),transparent 72%);opacity:.6;filter:blur(10px);z-index:0}
  .banner .shade{position:absolute;inset:0;background:
      linear-gradient(90deg,var(--card) 0%,var(--card) 33%,rgba(10,10,10,.35) 60%,transparent 82%)}
  .body{position:relative;z-index:2;padding:22px 20px;max-width:70%;display:flex;flex-direction:column;height:100%;justify-content:center;min-height:196px}
  .hdr{display:flex;align-items:center;gap:11px;margin-bottom:5px}
  .pico{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;box-shadow:0 7px 16px rgba(0,0,0,.45);animation:popPico .7s cubic-bezier(.34,1.56,.64,1) both}
  .pico svg{width:26px;height:26px;display:block}
  .pico-ig{background:linear-gradient(45deg,#f09433,#e6683c 30%,#dc2743 55%,#cc2366 75%,#bc1888);animation-delay:2.9s}
  .pico-wa{background:#25D366;animation-delay:3.06s}
  .pico-yt{background:#ff0000;animation-delay:3.22s}
  .tag{font-family:'Poppins',sans-serif;font-weight:700;font-size:10px;letter-spacing:.24em;color:var(--ac);text-transform:uppercase}
  .banner h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:21px;line-height:1.2;margin:8px 0 15px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .banner h2 b{color:var(--ac)}
  .cta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--ac);color:#131313;
    font-weight:700;font-size:13.5px;padding:11px 17px;border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .cta.escuro{color:#fff}
  .cta svg{width:15px;height:15px}
  /* cores por card */
  .ig{--card:#1a140d;--ac:#ef8a3c}
  .whats{--card:#0b2a1e;--ac:#2fd36b}
  .yt{--card:#1d1010;--ac:#ff4136}
  /* ---- rodapé ---- */
  footer{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .selo{width:60px;height:60px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
  .selo img{width:100%;height:100%;object-fit:cover}
  .social{display:flex;gap:14px}
  .social a{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:background .16s}
  .social a:hover{background:rgba(239,138,60,.2)}
  .copy{color:rgba(255,255,255,.4);font-size:11px;margin-top:4px;text-align:center}
  /* ---- mensagem (toast) do YouTube ---- */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(140%);
    max-width:min(440px,94vw);background:#15110c;color:#fff;border:1.5px solid var(--laranja);
    border-radius:18px;padding:22px 24px;font-size:18px;line-height:1.55;text-align:center;
    box-shadow:0 18px 46px rgba(0,0,0,.65);z-index:50;opacity:0;pointer-events:none;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast b{color:var(--laranja);font-size:20px}
  /* ---- abertura: a casa sendo construída + JV ---- */
  #splash{position:fixed;inset:0;z-index:100;background:#070707;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s ease}
  #splash.sai{opacity:0;pointer-events:none}
  #splash .logo-casa{width:210px;max-width:58vw;height:auto;
    clip-path:inset(100% 0 0 0);animation:construirLogo 1.25s cubic-bezier(.2,.8,.2,1) .15s forwards}
  #splash .nm{opacity:0;transform:translateY(10px);animation:surgir .55s ease 1.3s forwards;
    font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:.6px;color:#fff;font-size:22px}
  #splash .sb{opacity:0;animation:surgir .55s ease 1.5s forwards;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.3em;color:var(--laranja);text-transform:uppercase}
  @keyframes construirLogo{to{clip-path:inset(0 0 0 0)}}
  @keyframes surgir{to{opacity:1;transform:none}}
  @keyframes popPico{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.22);opacity:1;filter:brightness(1.7) drop-shadow(0 0 10px rgba(255,255,255,.6))}75%{transform:scale(.92)}100%{transform:scale(1);opacity:1;filter:none}}
  @media (prefers-reduced-motion:reduce){#splash .logo-casa{clip-path:none;animation:none}#splash .nm,#splash .sb{opacity:1;transform:none;animation:none}.pico{animation:none}}
  /* ===== COMPUTADOR: coluna mais larga e banners grandes (estilo Rodrigo Silva) ===== */
  @media (min-width:760px){
    body{padding:44px 24px 64px}
    .wrap{width:min(760px,94vw)}
    .topo{margin-bottom:34px}
    .topo .mark{width:82px}
    .topo .nome{font-size:29px}
    .topo .sub{font-size:12px}
    .links{gap:22px}
    .banner{min-height:262px;border-radius:28px}
    .banner .bg{width:56%;object-position:52% 12%}
    .body{padding:36px 40px;max-width:62%;min-height:262px}
    .pico{width:56px;height:56px;border-radius:16px}
    .pico svg{width:32px;height:32px}
    .tag{font-size:12px}
    .banner h2{font-size:32px;line-height:1.15;margin:12px 0 22px}
    .cta{font-size:16px;padding:15px 24px}
    .cta svg{width:17px;height:17px}
    .selo{width:74px;height:74px}
    .social a{width:52px;height:52px;border-radius:14px}
    .social a svg{width:26px;height:26px}
    #splash .logo-casa{width:290px;max-width:40vw}
    #splash .nm{font-size:30px}
    #splash .sb{font-size:12px}
    .toast{font-size:20px;max-width:540px;padding:26px 30px}
    .toast b{font-size:23px}
  }
</style>
</head>
